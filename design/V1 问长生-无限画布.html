<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问长生 · UI 交互稿 V1（无限画布）</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #e8b96a;
    --accent-dim: rgba(232,185,106,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    --font-serif: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
    --font-mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
    --note-bg: #262019;
    --note-border: rgba(232,185,106,0.22);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  .canvas-viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; --grid-color: rgba(255,255,255,0.04); }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute; left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing; z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  .section-header {
    position: absolute; pointer-events: none;
    display: flex; align-items: center; gap: 16px; white-space: nowrap;
  }
  .section-header .section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); opacity: 0.8; }
  .section-header .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--text-tertiary); }
  .section-header .section-line { flex: none; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.3; }

  .canvas-title { position: absolute; pointer-events: none; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; color: var(--text); }
  .canvas-text { position: absolute; line-height: 1.75; letter-spacing: 0.005em; color: var(--text-secondary); min-width: 200px; max-width: 560px; white-space: pre-wrap; word-break: break-word; }

  .canvas-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 100px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--text-secondary); background: var(--surface);
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: border-color var(--transition-fast), background var(--transition-fast);
  }
  .canvas-tag:hover { border-color: var(--border-hover); background: var(--surface-raised); }
  .canvas-tag .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .context-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); overflow: hidden; min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .context-card .card-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px; }
  .context-card .card-head .head-indicator { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .context-card .card-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
  .context-card .card-content { padding: 0 20px 20px; font-size: 13px; line-height: 1.75; color: var(--text-secondary); }
  .context-card .card-content ul { list-style: none; padding: 0; }
  .context-card .card-content li { padding: 4px 0 4px 12px; position: relative; }
  .context-card .card-content li::before { content: ''; position: absolute; left: 0; top: 12px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-tertiary); }

  .ds-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .ds-card .ds-head { padding: 16px 20px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-tertiary); }
  .ds-card .ds-body { padding: 0 20px 20px; }

  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 16px 18px; min-width: 200px; max-width: 320px; box-shadow: var(--shadow-sm); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); opacity: 0.75; margin-bottom: 8px; }
  .canvas-note .note-body { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }

  .design-page { background: #141118; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); transition: box-shadow var(--transition-normal); }
  .design-page:hover { box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35); }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11.5px; font-weight: 500; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.6; }

  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition-fast), color var(--transition-fast); }
  .zoom-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .zoom-btn:active { background: rgba(255,255,255,0.03); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(17,17,16,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .kbd-hint { position: fixed; top: 20px; right: 24px; z-index: 100; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd { font-family: var(--font-mono); padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }

  /* ══ 部件：小窗状态设计稿（Row 3 专用，纯实色、无发光/模糊/渐变） ══ */
  .wcs { position: relative; width: 100%; height: 100%; background: #0F0D13; color: #EFE9DD; font-family: var(--font-sans); display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  .wcs .plate { background: #1A1620; border: 1px solid rgba(232,185,106,0.18); border-radius: 10px; padding: 7px 9px 8px; }
  .wcs .topbar { display: flex; align-items: center; gap: 8px; height: 20px; }
  .wcs .realm { font-family: var(--font-serif); font-size: 14px; font-weight: 700; color: #FFE3A8; letter-spacing: 0.05em; }
  .wcs .stone { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11px; color: #A49C92; }
  .wcs .stone i { width: 8px; height: 8px; border-radius: 50%; background: #E8B96A; }
  .wcs .stone b { color: #FFE3A8; font-weight: 500; }
  .wcs .hide { width: 18px; height: 18px; line-height: 16px; text-align: center; border-radius: 50%; border: 1px solid rgba(232,185,106,0.35); background: #2A2320; color: #FFE3A8; font-size: 12px; }
  .wcs .qi-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 5px; font-size: 11.5px; }
  .wcs .rate { font-size: 10.5px; color: #7FD6A8; }
  .wcs .rate.low { color: #FFAE8C; }
  .wcs .track { position: relative; margin-top: 5px; height: 9px; border-radius: 5px; background: #0B0910; border: 1px solid rgba(232,185,106,0.16); overflow: hidden; }
  .wcs .fill { height: 100%; background: #E8B96A; border-radius: 4px; }
  .wcs .fill.trial { background: #FF8F7D; }
  .wcs .ticks { position: absolute; inset: 0; }
  .wcs .ticks i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(239,233,221,0.22); }
  .wcs .ticks i.key { background: rgba(255,143,125,0.55); }
  .wcs .mid { flex: 1; position: relative; }
  .wcs .fig { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .wcs .btn { height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; letter-spacing: 0.5px; border: 1px solid rgba(232,185,106,0.45); background: #2A2212; color: #FFE3A8; }
  .wcs .btn.disabled { color: #9C948A; border-color: rgba(150,145,140,0.22); background: #221E28; }
  .wcs .btn.trial { color: #FFD7C4; border-color: rgba(255,143,125,0.6); background: #2E1A18; }
  .wcs .badge { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: #0B0910; }
  .wcs .buff { height: 13px; font-size: 10.5px; color: #FFAE8C; }
  .wcs .log { background: #1A1620; border: 1px solid rgba(232,185,106,0.18); border-radius: 10px; padding: 6px 9px; font-size: 10.5px; line-height: 1.55; color: #C9C2B8; height: 76px; overflow: hidden; }
  .wcs .log .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wcs .log .t { color: #6F6A63; font-size: 9.5px; margin-right: 5px; }
  .wcs .ok { color: #FFE3A8; } .wcs .fail { color: #FF8F7D; } .wcs .off { color: #7FD6A8; } .wcs .sys { color: #9FD6FF; }
  .wcs .float { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 700; color: #FFD98A; font-size: 15px; white-space: nowrap; }
  .wcs .float.fail { color: #FF8F7D; } .wcs .float.off { color: #8FE3B6; }
  .wcs .bubble { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; background: #221C26; border: 1px solid rgba(255,143,125,0.55); border-radius: 10px; padding: 9px 12px; font-size: 11px; color: #FFD7C4; text-align: center; width: 210px; }
  .wcs .bubble .row { display: flex; gap: 8px; margin-top: 8px; }
  .wcs .bubble .b { flex: 1; height: 24px; line-height: 22px; border-radius: 6px; font-size: 11px; text-align: center; border: 1px solid rgba(255,143,125,0.55); color: #FFD7C4; }
  .wcs .bubble .b.ghost { border-color: rgba(150,145,140,0.3); color: #A49C92; }
  .wcs .card { position: absolute; left: 50%; transform: translateX(-50%); top: 46px; background: #16201C; border: 1px solid rgba(127,214,168,0.5); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: #BFEBD4; width: 250px; }
  .wcs .card b { color: #8FE3B6; }
  .wcs .center { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  .wcs .dim { color: #A49C92; font-size: 11.5px; }
  .wcs .big { font-family: var(--font-serif); font-size: 17px; color: #FFE3A8; }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="缩小">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="放大">+</button>
  <button class="zoom-btn" id="zoomReset" title="重置视图" aria-label="重置视图">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>
<div class="kbd-hint" id="kbdHint"></div>
<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // 本地化：UI_STRINGS 为画布自身界面文案（中文）。
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    docTitle: '问长生 · UI 交互稿 V1（无限画布）',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚轮', '平移'], ['Ctrl 滚轮', '缩放'], ['Ctrl Z', '撤销']],
    sections: { context: '01 项目介绍', designSystem: '02 设计系统', deliverables: '03 设计稿 · 交互链路' },
  };

  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  let isPanning = false, panSX, panSY;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX; panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };

  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  let lastPinchDist = null, lastPinchCenter = null;
  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });
  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });
  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });
  }

  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  function addSection(rowY, label) {

    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px';
    el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);
    return rowY;
  }

  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';

    if (options.color) el.style.color = options.color;

  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ds');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';

    let body = '';
    if (type === 'color' && Array.isArray(data.colors)) {

        `<div class="color-chip" style="background:${c.hex}"><span class="chip-label">${c.name || c.hex}</span></div>`
      ).join('')}</div>`;
    } else if (type === 'typography' && Array.isArray(data.samples)) {
      body = `<div class="type-stack">${data.samples.map(s =>
        `<div class="type-row"><span class="type-label">${s.label}</span><span class="type-sample" style="font-size:${s.size}px;font-weight:${s.weight || 400};${s.font ? 'font-family:' + s.font : ''}">${s.text || 'Aa'}</span></div>`
      ).join('')}</div>`;
    } else if (typeof data.html === 'string') {
      body = data.html;
    }
    el.innerHTML = `<div class="ds-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="ds-head">${data.title || type}</div>
      <div class="ds-body">${body}</div>

    makeDraggable(el);
    return el;
  }
